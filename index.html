<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live TV</title>
  <script src="https://unpkg.com/mux.js/dist/mux.min.js"></script>
  <script src="https://unpkg.com/shaka-player@latest/dist/shaka-player.compiled.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/hls.js@latest/dist/hls.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
        :root {
            --primary-color: #e50914;
            --bg-dark: #0f0f0f;
            --sidebar-bg: #1a1a1a;
            --card-bg: #2a2a2a;
            --accent-glow: rgba(229, 9, 20, 0.3);
            --card-min-width: 140px;
            --card-gap: 12px;
            --card-padding: 15px;
        }
        body { 
            background: var(--bg-dark); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        #sidebar { 
            width: 100%;  
            height: 100vh; 
            overflow-y: auto; 
            background: var(--sidebar-bg); 
            z-index: 10;
        }
        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        .sidebar-header {
            padding: 8px 10px;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            background: var(--sidebar-bg);
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #lottie-logo {
            width: auto;
            height: 50px; 
            max-width: 100%;
        }
        #channel-list { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(var(--card-min-width), 1fr));
            padding: var(--card-padding); 
            gap: var(--card-gap); 
        }
        .channel-item { 
            aspect-ratio: 16/10;
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: var(--card-bg); 
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            outline: none;
        }
        .channel-item:hover,
        .channel-item:focus { 
            transform: translateY(-5px) scale(1.03);
            border-color: var(--primary-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), 0 0 15px var(--accent-glow);
            background: #333;
        }
        .channel-item img { 
            max-width: 80%; 
            max-height: 80%; 
            object-fit: contain; 
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }
        @media (min-width: 600px) { :root { --card-min-width: 160px; --card-gap: 16px; --card-padding: 24px; } }
        @media (min-width: 960px) { :root { --card-min-width: 180px; --card-gap: 20px; --card-padding: 30px; } }
        @media (min-width: 1280px) {
            :root { --card-min-width: 220px; --card-gap: 24px; --card-padding: 40px; }
            .channel-item { border-radius: 16px; }
        }
        @media (min-width: 2560px) { :root { --card-min-width: 320px; --card-gap: 36px; --card-padding: 60px; } }
        #video-container { 
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000;
            z-index: 20;
            align-items: center;
            justify-content: center;
        }
        .video-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .video-wrapper video {
            width: 100%;
            height: 100%;
            background: #000;
        }
        .loading-text {
            color: #888;
            font-style: italic;
            text-align: center;
            grid-column: 1/-1;
            padding: 20px;
        }
  </style>
</head>
<body>

  <div id="sidebar">
      <div class="sidebar-header">
          <div id="lottie-logo"></div>
      </div>
      <div id="channel-list">
          <div class="loading-text">Loading Channels...</div>
      </div>
  </div>

  <div id="video-container">
      <div class="video-wrapper">
          <video id="tv-player" controls preload="auto" poster="https://i.postimg.cc/ZnRrqLdW/SCBWs.png" crossorigin="anonymous"></video>
      </div>
  </div>

  <script>
    // Mock Lottie error prevention if file doesn't exist yet
    try {
        lottie.loadAnimation({
          container: document.getElementById('lottie-logo'),
          renderer: 'svg',
          loop: true,
          autoplay: true,
          path: 'animation.json'
        });
    } catch(e) { console.log("Lottie asset skipped or missing."); }
  </script>

  <script>
    let player;
    let hls;

    async function lockScreenOrientation() {
      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch (err) { console.warn('Orientation lock failed:', err); }
    }

    async function requestFullscreenAndLockOrientation(video) {
      try {
        if (video.requestFullscreen) {
          await video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) { 
          await video.webkitRequestFullscreen();
        }
        await lockScreenOrientation();
      } catch (err) { console.warn('Fullscreen failed:', err); }
    }

    async function initShaka(url, drmData = null) {
      const container = document.getElementById('video-container');
      container.style.display = 'flex';
      window.history.pushState({ playerOpen: true }, '');

      const video = document.getElementById('tv-player');
      shaka.polyfill.installAll();

      if (hls) { hls.destroy(); hls = null; }
      if (player) { await player.destroy(); player = null; }

      const isHttpIpStream = url.startsWith('http://');

      if (isHttpIpStream && !drmData) {
        video.removeAttribute('crossorigin');
        video.src = url;
        video.load();
        await requestFullscreenAndLockOrientation(video);
        video.play().catch(err => {
          video.muted = true;
          video.play();
        });
        return;
      }

      video.setAttribute('crossorigin', 'anonymous');
      player = new shaka.Player(video);
      
      try {
        if (url.includes('.m3u8') && !drmData) {
          await player.unload();
          player.detach();

          if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.load();
            await requestFullscreenAndLockOrientation(video);
            await video.play();
          } else if (Hls.isSupported()) {
            hls = new Hls({ xhrSetup: function(xhr) { xhr.withCredentials = false; }, crossOrigin: true });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, async () => {
              await requestFullscreenAndLockOrientation(video);
              await video.play();
            });
          }
        } else {
          player.configure({
            drm: drmData ? { clearKeys: { [drmData.keyId]: drmData.key } } : {}
          });
          await player.load(url);
          await requestFullscreenAndLockOrientation(video);
          await video.play();
        }
      } catch (error) {
        video.src = url;
        video.load();
        video.play().catch(e => console.error(e));
      }
    }

    function handlePlayerBackAction() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) { document.exitFullscreen().catch(e => console.log(e)); }
        window.history.pushState({ playerOpen: true }, '');
      } else {
        closePlayer();
      }
    }

    async function closePlayer() {
      const video = document.getElementById('tv-player');
      video.pause();
      if (hls) { hls.destroy(); hls = null; }
      if (player) { await player.destroy(); player = null; }
      video.src = "";
      video.load();
      document.getElementById('video-container').style.display = 'none';
    }

    // NEW JAVASCRIPT-BASED PARSER REPLACING PHP
    async function loadPlaylist(playlistUrl, isFirstPlaylist) {
      try {
        // Fetch raw M3U text content directly via JS fetch
        const response = await fetch(playlistUrl);
        const content = await response.text();

        const lines = content.split('\n');
        const channels = [];
        let current = {};

        // Emulating your exact PHP regex loop logic
        lines.forEach(line => {
          line = line.trim();
          if (!line) return;

          if (line.startsWith('#EXTINF')) {
            const logoMatch = line.match(/tvg-logo="([^"]+)"/);
            const commaPos = line.lastIndexOf(',');
            const name = commaPos !== -1 ? line.substring(commaPos + 1) : 'Unknown Channel';

            current = {
              name: name.trim(),
              logo: logoMatch ? logoMatch[1] : ''
            };
          } else if (line.startsWith('#KODIPROP') && line.includes('license_key=')) {
            const keyInfo = line.match(/license_key=(.*?):(.*)/);
            if (keyInfo) {
              current.drm = 'clearkey';
              current.keyId = keyInfo[1].trim();
              current.key = keyInfo[2].trim();
            }
          } else if (!line.startsWith('#')) {
            current.url = line;
            channels.push(current);
            current = {};
          }
        });

        const playlistEl = document.getElementById('channel-list');
        if (isFirstPlaylist) {
          playlistEl.innerHTML = '';
        }

        channels.forEach(channel => {
          const li = document.createElement('div');
          li.className = 'channel-item';
          li.setAttribute('tabindex', '0');
          li.setAttribute('data-url', channel.url);
          li.setAttribute('data-drm', channel.drm ? 'clearkey' : 'false');
          
          if (channel.drm) {
            li.setAttribute('data-key-id', channel.keyId);
            li.setAttribute('data-key', channel.key);
          }

          const img = document.createElement('img');
          img.src = channel.logo || 'https://via.placeholder.com/100?text=No+Logo';
          img.alt = channel.name;

          li.appendChild(img);
          playlistEl.appendChild(li);

          li.addEventListener('click', () => {
            const url = li.getAttribute('data-url');
            const isDrm = li.getAttribute('data-drm') === 'clearkey';
            const drmData = isDrm ? { keyId: li.getAttribute('data-key-id'), key: li.getAttribute('data-key') } : null;
            initShaka(url, drmData);
          });
        });
      } catch (error) {
        console.error('Failed to parse remote list:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const playlists = [
        'https://modsmz.github.io/ch/sports.m3u',
        'https://raw.githubusercontent.com/Ajayone8x/sportzx-playlist/refs/heads/main/Sportzx.m3u8'
      ];

      for (let i = 0; i < playlists.length; i++) {
        await loadPlaylist(playlists[i], i === 0);
      }
    });

    window.addEventListener('popstate', () => {
      if (document.getElementById('video-container').style.display === 'flex') handlePlayerBackAction();
    });
  </script>
</body>
</html>
